# Deploys this branch's docs to GitHub Pages on every push.
name: Docs preview

on:
  push:
    branches: [docs-preview]

# Pages serves one site, so the newest push wins.
concurrency:
  group: docs-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
      - name: Point site_url at the preview
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: sed -i "s|^site_url = .*|site_url = \"$SITE_URL\"|" zensical.toml
      - run: make docs-install
      - run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
